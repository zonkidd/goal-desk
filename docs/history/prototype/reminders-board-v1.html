    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .mesh-bg {
      background:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(147, 51, 234, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(236, 72, 153, 0.08) 0px, transparent 50%),
        #f8fafc;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
    }

    .sidebar-item {
      transition: all 0.2s;
    }

    .sidebar-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .sidebar-item.active {
      background: rgba(255, 255, 255, 0.15);
      border-left: 3px solid white;
    }

  <script>
    let currentView = 'byList';
    let hideCompleted = false;

    function switchView(view) {
      currentView = view;

      // Update tabs
      const tabByList = document.getElementById('tabByList');
      const tabByTime = document.getElementById('tabByTime');

      if (view === 'byList') {
        tabByList.className = 'rounded-xl px-6 py-2 text-sm font-bold text-slate-900 bg-white shadow-sm';
        tabByTime.className = 'rounded-xl px-6 py-2 text-sm font-bold text-slate-600';
        document.getElementById('byListView').classList.remove('hidden');
        document.getElementById('byTimeView').classList.add('hidden');
      } else {
        tabByTime.className = 'rounded-xl px-6 py-2 text-sm font-bold text-slate-900 bg-white shadow-sm';
        tabByList.className = 'rounded-xl px-6 py-2 text-sm font-bold text-slate-600';
        document.getElementById('byListView').classList.add('hidden');
        document.getElementById('byTimeView').classList.remove('hidden');
      }
    }

    function toggleHideCompleted() {
      hideCompleted = document.getElementById('hideCompleted').checked;

      // Find all completed items (has checked checkbox and opacity-60)
      const completedItems = document.querySelectorAll('.opacity-60');

      completedItems.forEach(item => {
        if (hideCompleted) {
          item.style.display = 'none';
        } else {
          item.style.display = '';
        }
      });
    }
  </script>
