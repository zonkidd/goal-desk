<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Desk - 当前实现原型 v3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .mesh-bg {
      background:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(147, 51, 234, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(236, 72, 153, 0.08) 0px, transparent 50%),
        #f8fafc;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.1);
    }

    .timeline-line::before {
      content: '';
      position: absolute;
      left: 60px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, #e2e8f0, #cbd5e1, #e2e8f0);
    }

    .progress-bar {
      animation: progress-fill 1.5s ease-out;
    }

    @keyframes progress-fill {
      from { width: 0; }
    }

    .animate-spring {
      animation: spring-in 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes spring-in {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .hover-lift {
      transition: transform 0.2s;
    }

    .hover-lift:hover {
      transform: translateY(-2px);
    }

    .sidebar-item {
      transition: all 0.2s;
    }

    .sidebar-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .sidebar-item.active {
      background: rgba(255, 255, 255, 0.15);
      border-left: 3px solid white;
    }
  </style>
</head>
<body class="mesh-bg h-screen overflow-hidden">

  <div class="flex h-full">
    <!-- Sidebar -->
    <aside class="w-64 bg-gradient-to-b from-indigo-600 to-indigo-700 p-6 shadow-2xl">
      <div class="mb-8">
        <h1 class="text-2xl font-black text-white">Goal Desk</h1>
        <p class="mt-1 text-xs font-semibold text-indigo-200">本地优先的目标管理</p>
      </div>

      <nav class="space-y-2">
        <button class="sidebar-item w-full rounded-xl px-4 py-3 text-left text-sm font-bold text-white">
          📥 收件箱
        </button>
        <button class="sidebar-item active w-full rounded-xl px-4 py-3 text-left text-sm font-bold text-white">
          🌟 今日焦点
        </button>
        <button class="sidebar-item w-full rounded-xl px-4 py-3 text-left text-sm font-bold text-white">
          📊 目标看板
        </button>
        <button class="sidebar-item w-full rounded-xl px-4 py-3 text-left text-sm font-bold text-white">
          🎯 领域管理
        </button>
      </nav>

      <div class="mt-8 space-y-2">
        <div class="text-[10px] font-black uppercase tracking-wider text-indigo-300">领域</div>
        <button class="sidebar-item w-full rounded-lg px-3 py-2 text-left text-xs font-semibold text-white">
          💼 工作
        </button>
        <button class="sidebar-item w-full rounded-lg px-3 py-2 text-left text-xs font-semibold text-white">
          📚 学习
        </button>
        <button class="sidebar-item w-full rounded-lg px-3 py-2 text-left text-xs font-semibold text-white">
          🏃 健康
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto">
      <!-- Top Bar -->
      <header class="glass-panel sticky top-0 z-20 border-b border-slate-200/50 px-10 py-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs font-bold uppercase tracking-[0.24em] text-slate-400">
              Desktop mode · SQLite synced
            </p>
          </div>
          <div class="flex items-center gap-3">
            <button class="rounded-2xl bg-slate-900 px-4 py-2 text-sm font-bold text-white transition-colors hover:bg-slate-800">
              ⌥Space 快速捕获
            </button>
          </div>
        </div>
      </header>

      <!-- Today View -->
      <div class="mx-auto max-w-7xl p-10">
        <div class="mb-8 flex items-end justify-between animate-spring">
          <div>
            <h1 class="text-4xl font-extrabold tracking-tight text-slate-900">今日焦点</h1>
            <p class="mt-2 font-medium text-slate-500">在时间流中推进你的顶层目标。</p>
          </div>
        </div>

        <div class="grid grid-cols-[1fr_400px] gap-8">
          <!-- Left Column -->
          <div class="flex flex-col gap-6">
            <!-- 今日持续推进 -->
            <div class="glass-panel relative z-10 rounded-3xl p-6">
              <div class="mb-4 flex items-center justify-between">
                <div>
                  <h2 class="text-lg font-bold text-slate-900">今日持续推进</h2>
                  <p class="mt-1 text-sm font-medium text-slate-500">开始时间与截止时间覆盖今天，且仍在推进中的待办。</p>
                </div>
                <span class="rounded-full bg-indigo-50 px-3 py-1 text-xs font-black text-indigo-600">3</span>
              </div>

              <div class="space-y-3">
                <!-- Task 1 - Critical -->
                <div class="group relative">
                  <button class="glass-card hover-lift flex w-full items-center justify-between rounded-2xl p-4 text-left">
                    <div>
                      <div class="text-sm font-bold text-slate-900">完成项目原型设计</div>
                      <div class="mt-1 text-xs font-semibold text-slate-500">Q2 产品迭代</div>
                    </div>
                    <div class="text-right text-xs font-bold">
                      <div class="mb-0.5 text-slate-500">已推进 3天</div>
                      <div class="flex items-center justify-end gap-1 text-red-600">
                        <span>还剩 2天</span>
                        <span class="text-base">🔥</span>
                      </div>
                    </div>
                  </button>

                  <!-- Tooltip -->
                  <div class="pointer-events-none absolute right-0 top-full z-[9999] mt-2 hidden group-hover:block">
                    <div class="rounded-xl bg-slate-900 px-4 py-3 text-white shadow-2xl" style="min-width: 200px">
                      <div class="mb-2 text-[10px] font-bold text-slate-400">完整时间线</div>
                      <div class="space-y-1 text-xs font-semibold">
                        <div class="flex justify-between">
                          <span class="text-slate-400">开始</span>
                          <span>2026-06-11</span>
                        </div>
                        <div class="flex justify-between">
                          <span class="text-slate-400">今天</span>
                          <span class="text-green-400">2026-06-14 (第3天)</span>
                        </div>
                        <div class="flex justify-between">
                          <span class="text-slate-400">截止</span>
                          <span class="text-red-400">2026-06-16</span>
                        </div>
                        <div class="mt-2 border-t border-slate-700 pt-2">
                          <div class="text-[10px] text-slate-400">
                            总计：5天 · 完成 60%
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Task 2 - Warning -->
                <button class="glass-card hover-lift flex w-full items-center justify-between rounded-2xl p-4 text-left">
                  <div>
                    <div class="text-sm font-bold text-slate-900">研究竞品分析报告</div>
                    <div class="mt-1 text-xs font-semibold text-slate-500">行业研究</div>
                  </div>
                  <div class="text-right text-xs font-bold">
                    <div class="mb-0.5 text-slate-500">已推进 1天</div>
                    <div class="flex items-center justify-end gap-1 text-amber-600">
                      <span>还剩 6天</span>
                      <span class="text-base">⏰</span>
                    </div>
                  </div>
                </button>

                <!-- Task 3 - No Deadline -->
                <button class="glass-card hover-lift flex w-full items-center justify-between rounded-2xl p-4 text-left">
                  <div>
                    <div class="text-sm font-bold text-slate-900">搭建测试环境</div>
                    <div class="mt-1 text-xs font-semibold text-slate-500">技术架构</div>
                  </div>
                  <div class="text-right text-xs font-bold">
                    <div class="mb-0.5 text-slate-500">已推进 5天</div>
                    <div class="flex items-center justify-end gap-1 text-slate-400">
                      <span>无截止日期</span>
                      <span class="text-base">∞</span>
                    </div>
                  </div>
                </button>
              </div>
            </div>

            <!-- 今日目标看点 -->
            <div class="glass-panel rounded-3xl border border-indigo-100 bg-indigo-50/30 p-6">
              <div class="mb-4 flex items-center justify-between">
                <div>
                  <h2 class="text-lg font-bold text-slate-900">今日目标看点</h2>
                  <p class="mt-1 text-sm font-medium text-slate-500">仅展示由持续推进待办牵引的目标。</p>
                </div>
                <span class="rounded-full bg-white px-3 py-1 text-xs font-black text-indigo-600">2</span>
              </div>

              <div class="space-y-3">
                <!-- Goal 1 -->
                <button class="glass-card hover-lift block w-full rounded-2xl p-4 text-left">
                  <div class="mb-3 flex items-start justify-between gap-4">
                    <div>
                      <span class="rounded bg-indigo-100 px-2 py-0.5 text-[10px] font-black uppercase text-indigo-700">工作</span>
                      <h3 class="mt-2 text-sm font-bold text-slate-900">Q2 产品迭代</h3>
                      <p class="mt-1 text-xs font-semibold text-slate-500">1 个持续推进待办覆盖今天</p>
                    </div>
                    <span class="text-xl font-black text-indigo-600">65%</span>
                  </div>

                  <div class="mb-3 h-2 w-full overflow-hidden rounded-full bg-slate-200/60">
                    <div class="progress-bar h-2 rounded-full bg-indigo-500" style="width: 65%"></div>
                  </div>

                  <div class="rounded-xl bg-white/70 p-3">
                    <div class="text-xs font-black uppercase text-slate-400">Next</div>
                    <div class="mt-1 text-sm font-bold text-slate-800">完成原型设计</div>
                  </div>
                </button>

                <!-- Goal 2 -->
                <button class="glass-card hover-lift block w-full rounded-2xl p-4 text-left">
                  <div class="mb-3 flex items-start justify-between gap-4">
                    <div>
                      <span class="rounded bg-indigo-100 px-2 py-0.5 text-[10px] font-black uppercase text-indigo-700">工作</span>
                      <h3 class="mt-2 text-sm font-bold text-slate-900">技术架构优化</h3>
                      <p class="mt-1 text-xs font-semibold text-slate-500">1 个持续推进待办覆盖今天</p>
                    </div>
                    <span class="text-xl font-black text-indigo-600">40%</span>
                  </div>

                  <div class="mb-3 h-2 w-full overflow-hidden rounded-full bg-slate-200/60">
                    <div class="progress-bar h-2 rounded-full bg-indigo-500" style="width: 40%"></div>
                  </div>

                  <div class="rounded-xl bg-white/70 p-3">
                    <div class="text-xs font-black uppercase text-slate-400">Next</div>
                    <div class="mt-1 text-sm font-bold text-slate-800">搭建测试环境</div>
                  </div>
                </button>
              </div>
            </div>
          </div>

          <!-- Right Column - Timeline -->
          <div class="glass-panel relative rounded-3xl p-8">
            <h2 class="mb-6 flex items-center gap-2 text-xl font-bold text-slate-900">
              <svg class="h-5 w-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke-width="2"/>
                <path d="M12 6v6l4 2" stroke-width="2" stroke-linecap="round"/>
              </svg>
              今日时间轴
            </h2>

            <div class="timeline-line relative space-y-6">
              <!-- Calendar Event -->
              <div class="relative z-10 flex gap-4">
                <div class="w-12 shrink-0 text-right">
                  <span class="text-xs font-black text-slate-500">09:00</span>
                </div>
                <div class="mt-1 h-3 w-3 shrink-0 rounded-full border-2 border-white bg-emerald-400"></div>
                <div class="glass-card flex-1 rounded-xl border border-slate-100 p-3">
                  <div class="mb-1 text-[10px] font-bold uppercase text-slate-500">Calendar Event</div>
                  <div class="text-sm font-bold text-slate-800">团队周会</div>
                </div>
              </div>

              <!-- Reminder -->
              <div class="relative z-10 flex gap-4">
                <div class="w-12 shrink-0 text-right">
                  <span class="text-xs font-black text-indigo-600">14:00</span>
                </div>
                <div class="mt-1 h-3 w-3 shrink-0 rounded-full border-2 border-white bg-indigo-500 ring-4 ring-indigo-100"></div>
                <button class="glass-card hover-lift flex-1 rounded-xl border-l-4 border-l-indigo-500 p-3 text-left shadow-md">
                  <div class="mb-1 text-[10px] font-bold uppercase text-slate-500">Apple Reminders</div>
                  <div class="text-sm font-bold text-slate-800">产品讨论会议</div>
                </button>
              </div>

              <!-- Desk Task -->
              <div class="relative z-10 flex gap-4">
                <div class="w-12 shrink-0 text-right">
                  <span class="text-xs font-black text-indigo-600">16:00</span>
                </div>
                <div class="mt-1 h-3 w-3 shrink-0 rounded-full border-2 border-white bg-amber-400"></div>
                <button class="glass-card hover-lift flex-1 rounded-xl border border-slate-100 p-3 text-left">
                  <div class="mb-1 text-[10px] font-bold uppercase text-slate-500">Desk Task</div>
                  <div class="text-sm font-bold text-slate-800">需求评审准备</div>
                </button>
              </div>

              <!-- Calendar Event (Done) -->
              <div class="relative z-10 flex gap-4 opacity-60">
                <div class="w-12 shrink-0 text-right">
                  <span class="text-xs font-black text-slate-500">18:00</span>
                </div>
                <div class="mt-1 h-3 w-3 shrink-0 rounded-full border-2 border-white bg-emerald-400"></div>
                <div class="glass-card flex-1 rounded-xl border border-slate-100 p-3">
                  <div class="mb-1 text-[10px] font-bold uppercase text-slate-500">Calendar Event</div>
                  <div class="text-sm font-bold text-slate-600 line-through">健身房训练</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // 添加交互效果
    document.querySelectorAll('.sidebar-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // 模拟 tooltip hover
    console.log('Goal Desk Prototype v3 - 基于当前实现的交互式原型');
  </script>

</body>
</html>
